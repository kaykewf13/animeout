<!DOCTYPE html>
<html>
<head>
  <title>AnimeOut</title>
</head>
<body>
  <h1>Catálogo</h1>
  <div id="app"></div>

  <script>
    fetch("catalog.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("app").innerHTML =
          data.map(i => `<p>${i.titulo}</p>`).join("");
      });
  </script>
</body>
</html>
